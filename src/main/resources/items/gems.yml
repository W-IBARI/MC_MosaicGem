# 宝石配置
# 内部名:
#   material: 物品材质
#   isEnchant: 是否附魔（光效）
#   name: 物品名称
#   lore: 物品lore（支持 ${随机数名} 占位符）
#   custom-model-data: 自定义模型序号
#   targetType: 可镶嵌的物品类型，不填默认全生效
#   targetMaterial: 可镶嵌的物品id，不填默认全生效
#   repetitions: 可重复镶嵌次数，不填默认无上限
#   random: 创建随机数（生成时随机取值，并应用到其他部分）
#   buffType: 加成生效方式
#     sx_attribute：SX 属性，属性行写入装备 lore，由 SX-Attribute 读取
#     vanilla_attribute：原版属性，直接附加到装备的属性修饰符（AttributeModifier）
#     enchant：附魔，直接附加/叠加到装备的原版附魔（CrazyEnchantments 附魔用 ce: 前缀）
#     mythicmobs_skill：MythicMobs 技能，镶嵌后按 MythicMobs 规则发动技能
#       attribute 格式：'技能名 @触发器'（如 'TestSkill @onSwing'），不写触发器默认 @onSwing；
#       安装 MythicCrucible 时由其物品技能系统触发（SWING/USE/RIGHTCLICK 等），
#       未安装时回退到内置的近战攻击触发（仅 onSwing/onAttack 类触发器生效）
#   attribute: 注入的属性行
#     sx_attribute 格式：'属性名：数值'（如 '攻击力：${random_value}'）
#     vanilla_attribute 格式：'原版属性id：数值'（如 'minecraft:attack_damage: ${random_value}'）
#     原版属性 id 的显示名在 messages/<语言>.yml 的 attribute-names 段中配置
#     enchant 格式：'附魔id：等级'（如 'minecraft:sharpness: ${random_value}' 或 'ce:Wither: 2'）
#     附魔 id 的显示名在 messages/<语言>.yml 的 enchant-names 段中配置

SA测试宝石:
  material: PAPER
  isEnchant: true
  name: "&cSA测试宝石"
  lore:
    - ''
    - '&7可镶嵌的装备类型: &f剑'
    - ''
    - '&f[ &c宝石属性 &f]'
    - '&a▪ 伤害增加：${random_value}'
  custom-model-data: 0
  targetType:
    - SWORD
  targetMaterial:
    - IRON_SWORD
  repetitions: 5
  random:
    random_value: '10.00~20.00'
  buffType: 'sx_attribute'
  attribute:
    - '攻击力：${random_value}'
    - '防御力：${random_value}'

原版测试宝石:
  material: PAPER
  isEnchant: true
  name: "&b原版测试宝石"
  lore:
    - ''
    - '&7可镶嵌的装备类型: &f剑'
    - ''
    - '&f[ &b原版属性 &f]'
    - '&a▪ 攻击伤害：${random_value}'
  custom-model-data: 0
  targetType:
    - SWORD
  targetMaterial:
    - IRON_SWORD
  repetitions: 5
  random:
    random_value: '5.00~10.00'
  buffType: 'vanilla_attribute'
  attribute:
    - 'minecraft:attack_damage: ${random_value}'
    - 'minecraft:attack_speed: 2'

附魔测试宝石:
  material: PAPER
  isEnchant: true
  name: "&d附魔测试宝石"
  lore:
    - ''
    - '&7可镶嵌的装备类型: &f剑'
    - ''
    - '&f[ &d附魔属性 &f]'
    - '&a▪ 锋利等级：${random_value}'
  custom-model-data: 0
  targetType:
    - SWORD
  targetMaterial:
    - IRON_SWORD
  repetitions: 5
  random:
    random_value: '1~5'
  buffType: 'enchant'
  attribute:
    - 'minecraft:sharpness: ${random_value}'
    - 'minecraft:unbreaking: 1'

MM技能测试宝石:
  material: PAPER
  isEnchant: true
  name: "&eMM技能测试宝石"
  lore:
    - ''
    - '&7可镶嵌的装备类型: &f剑'
    - ''
    - '&f[ &eMythicMobs 技能 &f]'
    - '&a▪ 技能: TestSkill'
  custom-model-data: 0
  targetType:
    - SWORD
  targetMaterial:
    - IRON_SWORD
  repetitions: 5
  buffType: 'mythicmobs_skill'  # MythicMobs 技能：按 MythicCrucible 物品技能规则触发
  attribute:
    - 'TestSkill @onSwing'
