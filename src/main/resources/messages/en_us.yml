# Player messages (editable; {xxx} are placeholder variables)
# Language files are named messages_<language>.yml and are selected by
# settings.language in config.yml. Built-in languages: zh_cn, en_us.
# Every blocked or failed interaction notifies the player; the keys map to:
#   punch-max-global            Punch: item holes reached the global limit
#   punch-max-source            Punch: this puncher type reached its source limit
#   punch-fail                  Punch: success-rate check failed (tool consumed, item/gems unaffected)
#   socket-no-hole              Socket: item has no holes yet
#   socket-full                 Socket: item holes are full
#   socket-repeat-limit         Socket: this gem reached its repeat-socketing limit
#   socket-bufftype-unsupported Socket: gem buffType is unsupported (only sx_attribute)
#   remove-empty                Remove: item has no socketed gems
#   remove-fail                 Remove: success-rate check failed (tool consumed)
#   target-invalid              Operation: target item type/material does not match tool limits
#   interaction-disabled        Operation: this interaction method is disabled in config
#   tool-config-missing         Drag: tool does not exist in config
#   invalid-combination         Drag: both items are tools, or combination is invalid
#   inventory-full              A returned gem fell on the ground because the inventory was full
messages:
  prefix: '&8[&6MosaicGem&8] '
  no-permission: '&cYou do not have permission to run this command!'
  reload-success: '&aConfiguration reloaded.'
  give-usage: '&cUsage: /mosaicgem give <id> [amount] [player] (or /mosaicgem give <gem|puncher|remover> <id> [amount] [player])'
  give-not-found: '&cNo {type} config found: &f{id}'
  give-not-found-all: '&cNo item config found: &f{id}'
  give-ambiguous: '&cMultiple items share this id; please specify a type: &f{types}'
  give-success: '&aGave &f{player} &a{amount}x &f{id}'
  player-not-found: '&cPlayer not found: &f{player}'
  debug-usage: '&cUsage: /mosaicgem debug [player]'
  list-usage: '&cUsage: /mosaicgem list <gem|puncher|remover>'
  punch-success: '&aPunch succeeded! Holes: &f{holes}&a/&f{max}'
  punch-max-global: '&cPunch failed: this item''s holes have reached the global limit ({max})!'
  punch-max-source: '&cPunch failed: this puncher type has reached its source limit ({max})!'
  punch-fail: '&cPunch failed; the puncher was consumed!'
  socket-success: '&aGem socketed successfully!'
  socket-no-hole: '&cSocket failed: this item has no holes yet. Punch it first!'
  socket-full: '&cSocket failed: this item''s holes are full!'
  socket-repeat-limit: '&cThis gem has reached its repeat socketing limit!'
  socket-bufftype-unsupported: '&cSocket failed: this gem''s buff type is not supported!'
  remove-success: '&aGem removed successfully; the gem was returned.'
  remove-fail: '&cRemoval failed; the remover was consumed!'
  remove-empty: '&cRemoval failed: this item has no socketed gems!'
  target-invalid: '&cThis item cannot be used for this operation!'
  interaction-disabled: '&cThis interaction method is disabled!'
  tool-config-missing: '&cThis tool is not in the config; contact an administrator!'
  invalid-combination: '&cThe combination of tool and target item is invalid!'
  inventory-full: '&eYour inventory is full; the returned item was dropped on the ground.'
  help-title: '&fCommand help'
  help-reload: '&7/mosaicgem reload &8- &fReload configuration'
  help-give: '&7/mosaicgem give <id> [amount] [player] &8- &fGive items (any type)'
  help-debug: '&7/mosaicgem debug [player] &8- &fView item debug info'
  help-list: '&7/mosaicgem list <gem|puncher|remover> &8- &fList configured items'
  help-selftest: '&7/mosaicgem selftest &8- &fRun configuration and data self-test'
  debug-no-item: '&c{player} has no item in their main hand'
  debug-title: '&7===== MosaicGem Debug ====='
  debug-holder: '&fHolder: &e{player}'
  debug-item: '&fItem: &e{item}'
  debug-amount: '&fAmount: &e{amount}'
  debug-display-name: '&fDisplay name: &e{name}'
  debug-custom-model-data: '&fCustomModelData: &e{value}'
  debug-enchant-glint: '&fEnchant glint: &e{value}'
  debug-lore: '&fLore:'
  debug-plugin-item: '&fPlugin item: &e{type} &7({id})'
  debug-random-values: '&fRandom values:'
  debug-holes: '&fHoles: &e{holes} &7/ Socketed: &e{gems}'
  debug-socketed-gems: '&fSocketed gems:'
  debug-injected-line: '&7Injected: {line}'
  debug-component-keys: '&fComponent keys: {keys}'
  debug-end: '&7===== Debug End ====='
  list-result: '&a{type} ({count}): &f{ids}'
  selftest-title: '&7===== MosaicGem Selftest ====='
  selftest-pass-fail: '&aPassed: &f{ok} &7/ Failed: &f{fail}'
  selftest-gem-fail: '&cGem [&f{id}&c] failed: {error}'
  selftest-puncher-fail: '&cPuncher [&f{id}&c] failed: {error}'
  selftest-remover-fail: '&cRemover [&f{id}&c] failed: {error}'
  selftest-socket-data-fail: '&cSocket data read/write failed: {error}'
  selftest-attribute-merge-fail: '&cAttribute lore merge failed: {error}'
  selftest-punch-lore-fail: '&cPunch lore update failed: {error}'
