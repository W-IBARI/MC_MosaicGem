# 宝石配置
# 内部名:
#   material: 物品材质
#   isEnchant: 是否附魔（光效）
#   name: 物品名称
#   lore: 物品lore（支持 ${随机数名} 占位符）
#   custom-model-data: 自定义模型序号
#   targetType: 可镶嵌的物品类型，不填默认全生效
#   targetMaterial: 可镶嵌的物品id，不填默认全生效
#   repetitions: 可重复镶嵌次数，不填默认无上限
#   random: 创建随机数（生成时随机取值，并应用到其他部分）
#   buffType: 加成生效方式，目前支持 sx_attribute
#   attribute: 注入到装备上的属性行（SX-Attribute 从装备 lore 读取）

测试宝石:
  material: PAPER
  isEnchant: true
  name: "&c测试宝石"
  lore:
    - ''
    - '&7可镶嵌的装备类型: &f剑'
    - ''
    - '&f[ &c宝石属性 &f]'
    - '&a▪ 伤害增加：${random_value}'
  custom-model-data: 0
  targetType:
    - SWORD
  targetMaterial:
    - IRON_SWORD
  repetitions: 5
  random:
    random_value: '10.00~20.00'
  buffType: 'sx_attribute'
  attribute:
    - '攻击力：${random_value}'
    - '防御力：${random_value}'
