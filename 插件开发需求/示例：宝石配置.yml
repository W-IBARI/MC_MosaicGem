# 内部名
测试宝石:
  #物品材质
  material: PAPER
  #是否附魔
  isEnchant: true
  #物品名称
  name: "&c测试宝石"
  #物品lore描述
  lore:
    - ''
    - '&7可镶嵌的装备类型: &f剑'
    - ''
    - '&f[ &c宝石属性 &f]'
    - '&a▪ 伤害增加：${random_value}'
  #自定义模型时，对应的模型序号
  custom-model-data: 0
  # 可镶嵌的物品类型：SWORD、SPEAR、AXE、HELMET、CHESTPLATE、LEGGINGS、BOOTS、ELYTRA。不符合则拦截镶嵌并提示，不填时默认全生效
  targetType:
    - SWORD
  # 可镶嵌的物品id。不符合则拦截镶嵌并提示，不填时默认全生效
  targetMaterial:
    - IRON_SWORD
  # 可重复镶嵌次数，这个字段不填时，默认无上限次数
  repetitions: 5
  # 创建随机数，这个数将在其他部分被调用
  random:
    # 随机数名可自定义，调用方法参考lore和attribute，需要生成后的随机数可被其他部分读取
    # 宝石生成时，就生成一个随机数，并作用到其他调用的部分中。随机数的配置位数和实际的生成位数有关系，例如，现在生成的随机数会有两位小数
    random_value: '10.00~20.00'
  # 加成生效时的调用插件，目前需要仅需要支持sx_attribute，未来会加入原版支持和对其他插件的支持
  buffType: 'sx_attribute'
  # 属性生效值，“xxx：数值”中，xxx对应的是SX-Attribute中的属性名，你需要查看其api，决定如何生效
  attribute:
    - '攻击力：${random_value}'
    - '防御力：${random_value}'